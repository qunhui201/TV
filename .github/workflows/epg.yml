name: EPG Merge and Update

on:
  push:
    branches:
      - main
  schedule:
   - cron: '15 16,18,20,22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4

    - name: 1. Python 环境准备
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 2. 运行 Python 脚本下载并合并多源 EPG
      run: |
        python -u py/merge_epg.py

    - name: 3. 自动提交并推送合并后的 EPG 到仓库
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        git add epg.xml
        
        if ! git diff --cached --exit-code; then
          git commit -m "Auto Merge & Update EPG: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "EPG 无变动，跳过推送。"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ========== 新增：上传到 Cloudflare KV ==========
    - name: 4. 上传 epg.xml 到 Cloudflare KV
      if: success()
      env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      run: |
          set -e
          echo "正在上传 epg.xml 到 Cloudflare KV..."

          if [ ! -f epg.xml ]; then
            echo "❌ 错误：epg.xml 不存在"
            exit 1
          fi

          # 去除可能误复制的空格和换行
          ACC_ID=$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          NS_ID=$(printf '%s' "$CF_KV_NAMESPACE_ID" | tr -d '[:space:]')
          TOKEN=$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')

          if [ -z "$ACC_ID" ] || [ -z "$NS_ID" ] || [ -z "$TOKEN" ]; then
            echo "❌ Secret 为空：ACC_ID长度=${#ACC_ID}, NS_ID长度=${#NS_ID}, TOKEN长度=${#TOKEN}"
            exit 1
          fi

          echo "校验通过 -> Account ID 长度: ${#ACC_ID}, Namespace ID 长度: ${#NS_ID}"
          FILE_SIZE=$(du -h epg.xml | cut -f1)
          echo "文件大小: $FILE_SIZE"

          URL="https://api.cloudflare.com/client/v4/accounts/${ACC_ID}/storage/kv/namespaces/${NS_ID}/values/epg.xml"

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X PUT "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: text/xml" \
            --data-binary @epg.xml)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP 状态码: $HTTP_CODE"
          echo "响应内容: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 上传失败！"
            exit 1
          fi

          echo "✅ 上传成功！"
