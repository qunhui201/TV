name: EPG Merge and Update

on:
  push:
    branches:
      - main
  schedule:
   - cron: '15 16,18,20,22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4

    - name: 1. Python 环境准备
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 2. 运行 Python 脚本下载并合并多源 EPG
      run: |
        python -u py/merge_epg.py

    - name: 3. 自动提交并推送合并后的 EPG 到仓库
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        git add epg.xml
        
        if ! git diff --cached --exit-code; then
          git commit -m "Auto Merge & Update EPG: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "EPG 无变动，跳过推送。"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ========== 新增：上传到 Cloudflare KV ==========
    - name: 4. 上传 epg.xml 到 Cloudflare KV
      if: success()   # 只有前面步骤成功才执行
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      run: |
        echo "正在上传 epg.xml 到 Cloudflare KV..."
        
        # 检查文件是否存在
        if [ ! -f epg.xml ]; then
          echo "错误：epg.xml 不存在"
          exit 1
        fi
        
        FILE_SIZE=$(du -h epg.xml | cut -f1)
        echo "文件大小: $FILE_SIZE"
        
        # 使用 Cloudflare API 上传（PUT value）
        RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
          "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/epg.xml" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" \
          -H "Content-Type: text/xml" \
          --data-binary @epg.xml)
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ 上传成功！HTTP $HTTP_CODE"
          echo "$BODY"
        else
          echo "❌ 上传失败！HTTP $HTTP_CODE"
          echo "$BODY"
          exit 1
        fi
