name: EPG Merge and Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 16,18,20,22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 1. Python 环境准备
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 2. 运行 Python 脚本下载并合并多源 EPG
        run: |
          python -u py/merge_epg.py
          if [ ! -f epg.xml ]; then
            echo "❌ 错误：epg.xml 未生成"
            exit 1
          fi

          # 生成 epg.xml.gz 并校验压缩包完整性
          gzip -9 -k -f epg.xml
          gzip -t epg.xml.gz
          echo "✅ epg.xml.gz 校验通过"
          ls -lh epg.xml epg.xml.gz

      - name: 3. 自动提交并推送合并后的 EPG 到仓库
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          if ! git diff --cached --exit-code; then
            git commit -m "Auto Merge & Update EPG: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "EPG 无变动，跳过推送。"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. 上传 epg.xml 和 epg.xml.gz 到 Cloudflare KV
        if: success()
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          set -e

          ACC_ID=$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          NS_ID=$(printf '%s' "$CF_KV_NAMESPACE_ID" | tr -d '[:space:]')
          TOKEN=$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')

          if [ -z "$ACC_ID" ] || [ -z "$NS_ID" ] || [ -z "$TOKEN" ]; then
            echo "❌ Secret 为空，请检查 CF_ACCOUNT_ID / CF_KV_NAMESPACE_ID / CF_API_TOKEN"
            exit 1
          fi

          upload_to_kv() {
            local file_path="$1"
            local kv_key="$2"
            local content_type="$3"

            if [ ! -f "$file_path" ]; then
              echo "❌ 文件不存在: $file_path"
              exit 1
            fi

            local file_size
            file_size=$(du -h "$file_path" | cut -f1)
            echo "正在上传 [$file_path] ($file_size) -> KV Key: [$kv_key]..."

            local url="https://api.cloudflare.com/client/v4/accounts/${ACC_ID}/storage/kv/namespaces/${NS_ID}/values/${kv_key}"
            local response http_code body

            response=$(curl -sS --retry 2 --retry-delay 2 -w "\n%{http_code}" -X PUT "$url" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: ${content_type}" \
              --data-binary @"$file_path")

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            echo "[$kv_key] HTTP 状态码: $http_code | 响应: $body"
            if [ "$http_code" != "200" ]; then
              echo "❌ 上传 [$kv_key] 失败！"
              exit 1
            fi
            echo "✅ [$kv_key] 上传成功！"
          }

          upload_to_kv "epg.xml" "epg.xml" "application/xml; charset=utf-8"
          upload_to_kv "epg.xml.gz" "epg.xml.gz" "application/gzip"
