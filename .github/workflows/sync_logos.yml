name: 同步 Cloudflare KV 台标备份

on:
  repository_dispatch:
    types: [sync_logos_event] # 监听来自 Cloudflare Worker 的呼叫
  workflow_dispatch:          # 允许在网页手动点击

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. 检出当前代码库
        uses: actions/checkout@v4

      - name: 2. Python 环境准备
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: pip install requests

      - name: 4. 执行台标同步脚本
        run: python -u py/sync_logos.py

      - name: 5. 自动提交并推送变动到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add logo/
          
          # 如果没有改动，直接退出
          if git diff --staged --quiet; then
            echo "✨ 台标无变动，跳过推送。"
            exit 0
          fi
          
          git commit -m "自动同步 Cloudflare KV 台标备份: $(date +'%Y-%m-%d %H:%M:%S')"
          
          # 循环拉取并尝试推送，防止并发冲突导致失败（最多重试 5 次）
          for i in {1..5}; do
            git pull origin main --rebase --autostash && git push && break
            echo "⚠️ 推送冲突，正在进行第 $i 次重试..."
            sleep 3
          done
