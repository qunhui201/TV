name: 同步 Cloudflare KV 台标备份

on:
  schedule:
    # 每天北京时间凌晨 3 点和下午 3 点各同步一次 (可自行修改 cron)
    - cron: '0 */4 * * *'
  workflow_dispatch: # 允许在 GitHub 页面手动点击同步

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. 检出当前代码库
        uses: actions/checkout@v4

      - name: 2. Python 环境准备
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: pip install requests

      - name: 4. 执行台标同步脚本
        run: python -u py/sync_logos.py

      - name: 5. 自动提交并推送变动到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 暂存所有变动
          git add logo/
          
          # 如果有未暂存的其他文件也可以一起 add .
          git add .
          
          # 安全拉取防止冲突
          git pull origin main --rebase --autostash
          
          if git diff --staged --quiet; then
            echo "✨ 台标无变动，跳过推送。"
          else
            git commit -m "自动同步 Cloudflare KV 台标备份: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
